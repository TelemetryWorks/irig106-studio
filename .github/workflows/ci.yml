name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck source and Vite config
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  rust-workspace:
    name: Rust workspace (core + tauri)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Resolve compiler cache identity
        id: rustc
        run: |
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
          echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-workspace-v2-${{ steps.rustc.outputs.version }}-${{ steps.rustc.outputs.commit }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-workspace-v2-${{ steps.rustc.outputs.version }}-${{ steps.rustc.outputs.commit }}-

      - name: Setup Node.js for Tauri version alignment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check Tauri Rust and JavaScript version alignment
        run: |
          node --test scripts/check-tauri-versions.test.mjs
          set -o pipefail
          npm run tauri -- info | node scripts/check-tauri-versions.mjs

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js for WASM export tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Resolve compiler cache identity
        id: rustc
        run: |
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
          echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/irig106-studio-wasm/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-wasm-v2-${{ steps.rustc.outputs.version }}-${{ steps.rustc.outputs.commit }}-${{ hashFiles('crates/irig106-studio-wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-wasm-v2-${{ steps.rustc.outputs.version }}-${{ steps.rustc.outputs.commit }}-

      - name: Install checksum-verified prebuilt wasm-pack
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-pack@0.13.1
          checksum: true
          fallback: none

      - name: Build WASM
        run: cd crates/irig106-studio-wasm && wasm-pack build --target web --out-dir ../../src/wasm

      - name: Test WASM pagination exports
        run: npm run test:wasm

  msrv:
    name: Desktop MSRV (Rust 1.90)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify declared desktop minimum
        run: |
          python3 - <<'PYTHON'
          import tomllib
          with open("src-tauri/Cargo.toml", "rb") as manifest:
              assert tomllib.load(manifest)["package"]["rust-version"] == "1.90"
          PYTHON

      - name: Setup declared minimum Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.90'

      - name: Resolve compiler cache identity
        id: rustc
        run: |
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
          echo "commit=$(rustc -vV | sed -n 's/^commit-hash: //p')" >> "$GITHUB_OUTPUT"

      - name: Cache MSRV cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-msrv-v1-${{ steps.rustc.outputs.version }}-${{ steps.rustc.outputs.commit }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-msrv-v1-${{ steps.rustc.outputs.version }}-${{ steps.rustc.outputs.commit }}-

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Check declared desktop crate and its core dependency
        run: cargo check --locked --package irig106-studio

  dependency-security:
    # Intentionally additional/non-required; no ruleset or check status bypass.
    name: Dependency and security validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Rust for dependency metadata
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install checksum-verified prebuilt cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none

      - name: Audit workspace dependencies
        run: cargo deny --format json --locked --workspace --config deny.toml check advisories licenses bans sources

      - name: Audit standalone WASM dependencies
        if: ${{ !cancelled() }}
        run: cargo deny --format json --locked --manifest-path crates/irig106-studio-wasm/Cargo.toml --config deny.toml check advisories licenses bans sources

      - name: Setup Node.js for production dependency audit
        if: ${{ !cancelled() }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Audit production npm dependencies
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high
