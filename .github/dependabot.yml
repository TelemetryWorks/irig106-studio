version: 2
# Owner policy (2026-11-16): docs/security/dependabot-policy.md.
# Plan version-update majors deliberately; security updates remain unaffected.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: cargo
    directories:
      - /
      - /src-tauri
      - /crates/irig106-studio-core
      - /crates/irig106-studio-wasm
      - /crates/irig106-studio-core/fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
